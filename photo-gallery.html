<!DOCTYPE HTML>
<html>
    <head>
        <title>Images</title>
        <style>
            body {
                margin: 0;
                background: #373836;
                color: #222;
                font-family: "Helvetica Neue", Arial, sans-serif;
            }
            #all-contents {
                max-width: 1200px;
                margin: 0;
                padding: 16px 24px;
            }
            nav {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 48px;
                padding: 16px 24px;
                background:linear-gradient(to right, #1a1a2e, red);
                border: 1px solid #000000;
                border-radius: 12px;
            }
            nav h1 {
                margin: 0;
                font-size: 1.8rem;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.2em;
                color: #e94560;
                text-shadow: 0 0 5px #e94560;
            }
            #nav-ul {
                list-style: none;
                margin: 0;
                padding: 0;
                display: flex;
                gap: 16px;
            }
            .nav-li {
                display: inline-block;
            }
            #navanchor {
                text-decoration: none;
                color: #a8b2d8;
                font-weight: 500;
                font-size: 1.1rem;
                transition: color 0.2s;
                text-shadow: 1px 1px 6px #000;
                padding: 6px 14px;
            }
            #navanchor:hover {
                background: #e94560;
                color: #000000;
                box-shadow: 3px 5px;
                border-radius: 8px;
                transition:
                    background 0.25s ease,
                    color 0.25s ease;
            }
            .image-grid {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 32px;
                margin-top: 32px;
            }
            .image-item {
                
                transition: transform 0.2s;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 16px;
            }
            .image-item img {
                max-width: 100%;
                max-height: 320px;
                border-radius: 12px;
                box-shadow: 0 0 2px 2px #7e1d2d, 0 2px 8px 0 rgba(57,255,20,0.18);
                background: #18120f;
                border: 4px solid #e94560;
                transition: box-shadow 0.2s, border-color 0.2s, transform 0.2s;
            }
            .image-item img:hover {
                box-shadow: 0 0 8px 8px #7e1d2d, 0 2px 8px 0 rgba(255, 20, 20, 0.18);
                border-color: #e94560;
                transform: scale(1.08);
            }
            @media (max-width: 900px) {
                .image-grid {
                    grid-template-columns: repeat(2, 1fr);
                }
            }
            @media (max-width: 600px) {
                .image-grid {
                    grid-template-columns: 1fr;
                }
            }
    </style>
    </head>
    
    <body>
        <div id="all-contents">
            <nav>
                <h1>photos</h1>
                <ul id="nav-ul">
                    <li class="nav-li">
                        <a id="navanchor" href="index.html">Home</a>
                    </li>
                    <li class="nav-li">
                        <a id="navanchor" href="portfolio.html">Portfolio</a>
                        </li>
                    <li class="nav-li"><a id="navanchor" href="photo-gallery.html">Photo Gallery</a>
                    </li>
                    
                </ul>
            </nav>
                <div class="image-grid">
                    <div class="image-item"><img src="photos/IMG_7574.JPG" alt="IMG_3215"></div>
                    
                    <div class="image-item"><img src="photos/IMG_1382.JPG" ></div>
                    <div class="image-item"><img src="photos/IMG_1362.JPG" ></div>
                    <div class="image-item"><img src="photos/IMG_1369.JPG" ></div>
                    <div class="image-item"><img src="photos/IMG_1365.JPG" ></div>
                </div>
                <!-- Modal for full-size image -->
                <div id="imageModal" class="modal">
                    <span class="close">&times;</span>
                    <span class="modal-arrow left">&#10094;</span>
                    <img class="modal-content" id="modalImg" alt="Full Size">
                    <span class="modal-arrow right">&#10095;</span>
                </div>
    </body>
      
      
      
      
      
      
      
        <script>
        // Modal logic with navigation
        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('modalImg');
        const closeBtn = document.querySelector('.close');
        const leftArrow = document.querySelector('.modal-arrow.left');
        const rightArrow = document.querySelector('.modal-arrow.right');
        const images = Array.from(document.querySelectorAll('.image-item img'));
        let currentIndex = 0;

        function showModal(index) {
            currentIndex = index;
            modal.style.display = 'block';
            modalImg.src = images[index].src;
            modalImg.alt = images[index].alt;
        }

        images.forEach((img, idx) => {
            img.addEventListener('click', function() {
                showModal(idx);
            });
        });

        closeBtn.onclick = function() {
            modal.style.display = 'none';
            modalImg.src = '';
        }

        leftArrow.onclick = function(e) {
            e.stopPropagation();
            currentIndex = (currentIndex - 1 + images.length) % images.length;
            showModal(currentIndex);
        }

        rightArrow.onclick = function(e) {
            e.stopPropagation();
            currentIndex = (currentIndex + 1) % images.length;
            showModal(currentIndex);
        }

        window.onclick = function(event) {
            if (event.target === modal) {
                modal.style.display = 'none';
                modalImg.src = '';
            }
        }

        window.addEventListener('keydown', function(e) {
            if (modal.style.display === 'block') {
                if (e.key === 'ArrowLeft') {
                    currentIndex = (currentIndex - 1 + images.length) % images.length;
                    showModal(currentIndex);
                } else if (e.key === 'ArrowRight') {
                    currentIndex = (currentIndex + 1) % images.length;
                    showModal(currentIndex);
                } else if (e.key === 'Escape') {
                    modal.style.display = 'none';
                    modalImg.src = '';
                }
            }
        });
        </script>
        <style>
            .modal {
                display: none;
                position: fixed;
                z-index: 1000;
                left: 0;
                top: 0;
                width: 100vw;
                height: 100vh;
                overflow: auto;
                animation: fadeIn 0.3s;
            }
            .modal-content {
                display: block;
                margin: 5vh auto;
                max-width: 90vw;
                max-height: 80vh;
                border-radius: 18px;
                box-shadow: 0 8px 32px 0 rgba(255, 20, 20, 0.18);
                background: #18120f;
                border: 6px solid #e94560;
                animation: scaleUp 0.3s;
            }
            .close {
                position: absolute;
                top: 32px;
                right: 48px;
                color: #e94560;
                font-size: 48px;
                font-weight: 300;
                cursor: pointer;
                z-index: 1001;
                transition: color 0.2s;
                text-shadow: 2px 2px 8px #000;
            }
            .close:hover {
                color: #fff;
            }
            .modal-arrow {
                position: absolute;
                top: 50%;
                transform: translateY(-50%);
                color: #e94560;
                font-size: 64px;
                font-weight: 300;
                cursor: pointer;
                z-index: 1001;
                user-select: none;
                padding: 0 24px;
                transition: color 0.2s;
                text-shadow: 2px 2px 8px #000;
            }
            .modal-arrow.left {
                left: 0;
            }
            .modal-arrow.right {
                right: 0;
            }
            .modal-arrow:hover {
                color: #fff;
            }
            @keyframes fadeIn {
                from { opacity: 0; }
                to { opacity: 1; }
            }
            @keyframes scaleUp {
                from { transform: scale(0.95); }
                to { transform: scale(1); }
            }
        </style>
</html>
